services:
  - type: web
    name: dataforge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_API_BASE
        value: https://api.meta.ai/v1
      - key: MODEL_API_MODEL
        value: muse-spark-1.3
      - key: COMPANY_NAME
        value: Tempo
      - key: MODEL_API_KEY
        sync: false